services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eddembe
      POSTGRES_PASSWORD: eddembe
      POSTGRES_DB: eddembe
    ports:
      # 5433 on the host because a local Postgres often already uses 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
